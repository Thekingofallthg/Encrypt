<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom C++ Cipher</title>
    <style>
        html { background: #000 url("logo.png") center / cover no-repeat fixed; min-height: 100%; }
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: rgba(0,0,0,0.7); border: 1px solid #8f1a1a; border-radius: 10px; color: #d9d6cf; }
        h2, h3 { color: #ffffff; }
        a { color: #e03a3a; }
        textarea, input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 8px; background: #111111; color: #d9d6cf; border: 1px solid #8f1a1a; border-radius: 6px; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; margin-right: 8px; margin-top: 10px; background: #8f1a1a; color: #ffffff; border: none; border-radius: 6px; }
        button:hover { background: #b82222; }
        .result-box { background: rgba(255,255,255,0.08); color: #d9d6cf; padding: 15px; margin-top: 20px; border-radius: 6px; min-height: 24px; word-break: break-all; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>C++ Polyalphabetic Cipher</h2>

    <div id="loginBox">
        <input id="user" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
        <p id="loginMsg"></p>
        <a href="#" onclick="showAdminLogin(); return false;">Admin login</a>
    </div>

    <div id="adminLoginBox" class="hidden">
        <h3>Admin Login</h3>
        <input id="adminUser" placeholder="Admin username">
        <input id="adminPass" type="password" placeholder="Admin password">
        <button onclick="handleAdminLogin()">Login</button>
        <p id="adminMsg"></p>
        <a href="#" onclick="backToLogin(); return false;">Back</a>
    </div>

    <div id="adminPanel" class="hidden">
        <h3>Admin Panel</h3>
        <div id="userList"></div>
        <input id="newUser" placeholder="New username">
        <button onclick="handleAddUser()">Add user</button>
        <p id="panelMsg"></p>
        <button onclick="adminLogout()">Log out</button>
    </div>

    <div id="cipherBox" class="hidden">
        <p><em>Shifts letters (a–z, A–Z). Other characters are unchanged.</em></p>
        <textarea id="inputText" rows="4" placeholder="Enter your message here..."></textarea><br>
        <button onclick="handleEncrypt()">Encrypt</button>
        <button onclick="handleDecrypt()">Decrypt</button>
        <h3>Result:</h3>
        <div class="result-box" id="output"></div>
        <button onclick="copyResult()">Copy Result</button>
    </div>

    <script>
        // Must be defined before cipher.js loads
        var Module = {
            onRuntimeInitialized: function () {
                try {
                    const saved = localStorage.getItem('cipherUsers');
                    if (saved !== null) Module.setUsers(saved);
                } catch (e) {}
            }
        };
    </script>
    <script src="cipher.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const show = id => $(id).classList.remove('hidden');
        const hide = id => $(id).classList.add('hidden');
        let adminU = "", adminP = "";

        function saveUsers() {
            try {
                localStorage.setItem('cipherUsers', Module.getUserList(adminU, adminP));
            } catch (e) {}
        }

        function renderUsers() {
            const box = $('userList');
            box.innerHTML = "";
            Module.getUserList(adminU, adminP).split("\n").filter(Boolean).forEach(name => {
                const row = document.createElement('div');
                row.style.margin = "6px 0";
                const label = document.createElement('span');
                label.textContent = name + " ";
                const btn = document.createElement('button');
                btn.textContent = "Remove";
                btn.onclick = () => {
                    if (Module.removeUser(adminU, adminP, name)) {
                        saveUsers();
                        renderUsers();
                    }
                };
                row.append(label, btn);
                box.appendChild(row);
            });
        }

        function handleAddUser() {
            const name = $('newUser').value.trim();
            if (Module.addUser(adminU, adminP, name)) {
                $('newUser').value = "";
                $('panelMsg').innerText = "";
                saveUsers();
                renderUsers();
            } else {
                $('panelMsg').innerText = "Could not add (empty or already exists)";
            }
        }

        function handleLogin() {
            if (Module.login($('user').value, $('pass').value)) {
                hide('loginBox');
                show('cipherBox');
            } else {
                $('loginMsg').innerText = "Wrong username or password bud";
            }
        }

        function showAdminLogin() { hide('loginBox'); show('adminLoginBox'); }
        function backToLogin() { hide('adminLoginBox'); show('loginBox'); }

        function handleAdminLogin() {
            const u = $('adminUser').value;
            const p = $('adminPass').value;
            if (Module.adminLogin(u, p)) {
                adminU = u; adminP = p;
                $('adminPass').value = "";
                renderUsers();
                hide('adminLoginBox');
                show('adminPanel');
            } else {
                $('adminMsg').innerText = "Wrong admin credentials";
            }
        }

        function adminLogout() {
            adminU = ""; adminP = "";
            $('userList').innerHTML = "";
            hide('adminPanel');
            show('loginBox');
        }

        function handleEncrypt() { $('output').innerText = Module.encryptText($('inputText').value); }
        function handleDecrypt() { $('output').innerText = Module.decryptText($('inputText').value); }

        function copyResult() {
            const out = $('output').innerText;
            if (out) {
                navigator.clipboard.writeText(out);
                alert("Copied to clipboard!");
            }
        }
    </script>
</body>
</html>
