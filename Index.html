<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom C++ Cipher</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; margin-right: 8px; margin-top: 10px; }
        .result-box { background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 6px; min-height: 24px; word-break: break-all; }
    </style>
</head>
<body>
    <h2>C++ Polyalphabetic Cipher</h2>
    <p><em>Note: Currently shifts lowercase letters (a–z).</em></p>
    
    <textarea id="inputText" rows="4" placeholder="Enter your message here..."></textarea><br>
    
    <button onclick="handleEncrypt()">Encrypt</button>
    <button onclick="handleDecrypt()">Decrypt</button>
    
    <h3>Result:</h3>
    <div class="result-box" id="output"></div>
    <button onclick="copyResult()">Copy Result</button>

    <script src="cipher.js"></script>
    <script>
        function handleEncrypt() {
            const text = document.getElementById('inputText').value;
            document.getElementById('output').innerText = Module.encryptText(text);
        }

        function handleDecrypt() {
            const text = document.getElementById('inputText').value;
            document.getElementById('output').innerText = Module.decryptText(text);
        }

        function copyResult() {
            const output = document.getElementById('output').innerText;
            if (output) {
                navigator.clipboard.writeText(output);
                alert("Copied to clipboard!");
            }
        }
    </script>
</body>
</html>
